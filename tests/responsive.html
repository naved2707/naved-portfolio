<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Portfolio responsive review</title><style>body{margin:0;background:#d9ddd7;font:14px system-ui;color:#17251e}header{position:sticky;top:0;display:flex;align-items:center;gap:16px;padding:12px 20px;background:white;z-index:2}label{display:flex;align-items:center;gap:10px}select{font:inherit;padding:7px}main{padding:20px;overflow:auto}iframe{display:block;border:0;background:white;box-shadow:0 4px 30px #0002;height:820px;width:375px}output{font:12px monospace}</style></head><body><header><b>Responsive review</b><label>Viewport width<select id="width"><option>320</option><option selected>375</option><option>425</option><option>768</option><option>1024</option><option>1280</option><option>1440</option><option>1920</option></select></label><output id="result">Loading…</output></header><main><iframe title="Portfolio preview" src="/"></iframe></main><script>const frame=document.querySelector('iframe');const select=document.querySelector('select');const result=document.querySelector('output');function measure(){const doc=frame.contentDocument;if(doc?.documentElement){const page=doc.documentElement;result.textContent='Viewport '+page.clientWidth+'px / content '+page.scrollWidth+'px'+(page.scrollWidth>page.clientWidth?' — overflow':' — fits');}}select.addEventListener('change',()=>{frame.style.width=select.value+'px';measure();});frame.addEventListener('load',()=>{new ResizeObserver(measure).observe(frame.contentDocument.body);measure();});</script></body></html>
